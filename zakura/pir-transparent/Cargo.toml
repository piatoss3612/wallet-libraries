[package]
name = "zakura-pir-transparent"
version = "0.0.1-rc0"
description = "Bounded reference transparent PIR recovery into candidate wallet evidence"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
keywords = ["zcash", "privacy", "pir"]

[features]
default = []
wallet = ["dep:zcash_client_backend", "dep:zcash_primitives", "dep:zcash_protocol", "dep:transparent", "dep:transparent-wallet", "dep:transparent-wallet-store", "dep:transparent-events", "dep:transparent-filter", "dep:rusqlite", "dep:hex", "dep:serde_json"]

[dependencies]
zcash_client_backend = { workspace = true, optional = true, features = ["transparent-inputs"] }
zcash_primitives = { workspace = true, optional = true }
zcash_protocol = { workspace = true, optional = true }
transparent = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
sha2.workspace = true
serde_json = { workspace = true, optional = true }
thiserror = "2"
url = "2"
transparent-wallet = { git = "https://github.com/valargroup/wallet-pir", rev = "3cfbc4848b92b1385b9215174251f8e51fbfa804", optional = true, features = ["reqwest"] }
transparent-wallet-store = { git = "https://github.com/valargroup/wallet-pir", rev = "3cfbc4848b92b1385b9215174251f8e51fbfa804", optional = true }
transparent-events = { git = "https://github.com/valargroup/wallet-pir", rev = "3cfbc4848b92b1385b9215174251f8e51fbfa804", optional = true }
transparent-filter = { git = "https://github.com/valargroup/wallet-pir", rev = "3cfbc4848b92b1385b9215174251f8e51fbfa804", optional = true }

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
